# Runs /api/cron/reminders every 30 minutes: releases expired payment holds, reconciles
# Razorpay payments and refunds whose callback/webhook didn't arrive, sends booking reminders
# and cleans up. Works with any host. Configure two repository secrets:
#   APP_URL      e.g. https://courts.example.com
#   CRON_SECRET  the same value as the app's CRON_SECRET
name: Scheduled jobs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduler endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not configured; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminders"
