# Public demo on Vercel, deployed from GitHub Actions.
# Setup (once): add repository secrets
#   VERCEL_TOKEN  a Vercel access token (vercel.com → Account Settings → Tokens)
#   DATABASE_URL  pooled Postgres connection string for the DEMO database (e.g. Neon, Mumbai)
# Optional: RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET — Razorpay TEST keys
# (rzp_test_…) to enable checkout on the demo. Live keys are refused.
# Optional repository variables: VERCEL_PROJECT_NAME (default: smashpoint-demo) and
# VERCEL_SCOPE (team slug; default: the token's default team).
# Every push to the branch redeploys; the nightly job reloads fresh demo data.
name: Deploy demo

on:
  push:
    branches: [claude/intelligent-curie-qvjv33, main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'smashpoint-demo' }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - name: Check configuration
        id: config
        env:
          TOKEN_IN_VARS: ${{ vars.VERCEL_TOKEN != '' }}
          DB_IN_VARS: ${{ vars.DATABASE_URL != '' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          missing=0
          for name in VERCEL_TOKEN DATABASE_URL; do
            if [ -n "${!name}" ]; then echo "$name: found in repository secrets"; continue; fi
            missing=1
            if { [ "$name" = VERCEL_TOKEN ] && [ "$TOKEN_IN_VARS" = true ]; } || { [ "$name" = DATABASE_URL ] && [ "$DB_IN_VARS" = true ]; }; then
              echo "::error::$name was saved as a repository VARIABLE. Delete it there and add it under Settings → Secrets and variables → Actions → Secrets → New repository secret."
            else
              echo "::warning::$name is not a repository secret this workflow can read (Settings → Secrets and variables → Actions → Secrets tab; not Codespaces/Dependabot or an environment)."
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A manual run means someone wants a deploy, so make the problem visible.
            if [ "$MANUAL" = true ]; then exit 1; fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.config.outputs.ready == 'true'
        name: Install Vercel CLI
        run: npm install --global vercel@latest
      - if: steps.config.outputs.ready == 'true'
        name: Deploy and smoke-test
        run: bash .github/scripts/deploy-vercel-demo.sh

  reset-demo-data:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      # Reloads the demo academy (fresh dates, undoes visitors' changes). The seed refuses to
      # run unless the database was created as a demo, so it can't wipe real data.
      - if: steps.config.outputs.ready == 'true'
        name: Reload demo data
        run: npm run db:seed
